    color:var(--text-dark);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
    border-top:4px solid var(--coral);
  }
  h1,h2,h3,.display{font-family:'Space Grotesk',ui-sans-serif,sans-serif;letter-spacing:-0.01em;}
  .mono{font-family:'JetBrains Mono',ui-monospace,monospace;}
  button{font-family:inherit;cursor:pointer;border:none;outline:none;}
  input,textarea,select{font-family:inherit;}
  a{color:inherit;}
  ::selection{background:var(--coral);color:white;}
  :focus-visible{outline:2px solid var(--violet);outline-offset:2px;}

  /* ---------- layout shells ---------- */
  #app{min-height:100vh;}
  .screen{min-height:100vh;display:flex;flex-direction:column;}
  .hidden{display:none !important;}

  /* ---------- landing ---------- */
  .landing{
    position:relative;
    min-height:100vh;
    background:radial-gradient(circle at 20% 10%, #173796 0%, var(--ink) 45%, #04061a 100%);
    color:var(--text-light);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:32px 20px;
    text-align:center;
  }
  .landing .eyebrow{
    display:inline-flex;align-items:center;gap:8px;
    font-size:13px;letter-spacing:0.08em;text-transform:uppercase;color:var(--coral);
    margin-bottom:18px;font-weight:600;
  }
  .pulse-dot{width:8px;height:8px;border-radius:50%;background:var(--coral);position:relative;flex:none;}
  .pulse-dot::after{
    content:'';position:absolute;inset:-6px;border-radius:50%;
    border:2px solid var(--coral);opacity:0.6;
    animation:pulse-ring 1.8s ease-out infinite;
  }
  @keyframes pulse-ring{
    0%{transform:scale(0.6);opacity:0.8;}
    100%{transform:scale(2.2);opacity:0;}
  }
  .landing h1{font-size:clamp(34px,7vw,64px);line-height:1.02;margin:0 0 14px;font-weight:700;}
  .landing h1 span{color:var(--coral);}
  .landing p.sub{color:#C3CDF0;font-size:16px;max-width:420px;margin:0 auto 36px;line-height:1.55;}
  .host-link-subtle{
    position:absolute;top:18px;right:20px;
    background:none;border:none;color:#7B8BC4;font-size:12px;font-weight:600;
    padding:7px 12px;border-radius:5px;transition:color .15s ease, background .15s ease;
  }
  .host-link-subtle:hover{color:#fff;background:rgba(255,255,255,0.07);}
  .cta-participate{
    display:flex;flex-direction:column;align-items:center;gap:6px;
    background:var(--coral);color:var(--on-mint);
    border-radius:26px;padding:34px 44px;width:100%;max-width:320px;
    box-shadow:0 12px 32px rgba(42,79,218,0.4);
    transition:transform .16s ease, box-shadow .16s ease;
  }
  .cta-participate:hover{transform:translateY(-3px);box-shadow:0 16px 40px rgba(42,79,218,0.5);}
  .cta-participate:active{transform:translateY(-1px) scale(0.99);}
  .cta-participate .circle-lg{font-size:42px;line-height:1;margin-bottom:6px;}
  .cta-participate b{display:block;font-size:21px;font-family:'Space Grotesk',sans-serif;font-weight:700;}
  .cta-participate .desc{display:block;font-size:13px;opacity:0.85;margin-top:2px;}
  @media (max-width:420px){.host-link-subtle{top:14px;right:14px;font-size:11.5px;} .cta-participate{max-width:280px;padding:28px 32px;}}

  /* ---------- shared top bar ---------- */
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 22px;background:var(--paper-2);border-bottom:1px solid var(--border);
    position:sticky;top:0;z-index:20;
  }
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;font-family:'Space Grotesk',sans-serif;}
  .brand .dot{width:9px;height:9px;border-radius:50%;background:var(--coral);}
  .backlink{font-size:13px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px;}
  .backlink:hover{color:var(--text-dark);}

  /* ---------- buttons ---------- */
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    padding:12px 20px;border-radius:12px;font-weight:600;font-size:14.5px;
    transition:transform .12s ease, box-shadow .12s ease, opacity .12s ease;
  }
  .btn:active{transform:scale(0.97);}
  .btn-primary{background:var(--coral);color:var(--on-mint);box-shadow:0 6px 18px rgba(42,79,218,0.35);}
  .btn-primary:hover{background:var(--coral-dim);}
  .btn-primary:disabled{opacity:0.45;box-shadow:none;cursor:not-allowed;}
  .btn-dark{background:var(--ink);color:white;}
  .btn-dark:hover{background:var(--ink-2);}
  .btn-outline{background:transparent;border:1.5px solid var(--border);color:var(--text-dark);}
  .btn-outline:hover{border-color:var(--text-dark);}
  .btn-ghost{background:transparent;color:var(--muted);}
  .btn-ghost:hover{color:var(--text-dark);}
  .btn-sm{padding:8px 14px;font-size:13px;border-radius:9px;}
  .btn-block{width:100%;}
  .btn-square{border-radius:5px;font-weight:700;letter-spacing:0.01em;}
  .btn-square.btn-outline{border-width:1.5px;}
  .btn-square.btn-ghost:hover{background:rgba(255,255,255,0.06);}

  /* ---------- host shell ---------- */
  .host-wrap{display:flex;min-height:100vh;}
  .host-sidebar{
    width:280px;flex:none;background:var(--ink);color:var(--text-light);
    padding:20px 16px;display:flex;flex-direction:column;gap:18px;
  }
  .host-sidebar .brand{color:white;}
  .side-section h4{font-size:11px;text-transform:uppercase;letter-spacing:0.08em;color:#8FA0DE;margin:0 0 10px;font-weight:700;}
  .session-item{
    padding:12px 12px;border-radius:10px;margin-bottom:6px;cursor:pointer;
    display:flex;align-items:center;justify-content:space-between;gap:8px;
    border:1px solid transparent;
  }
  .session-item:hover{background:rgba(255,255,255,0.05);}
  .session-item.active{background:rgba(255,77,109,0.15);border-color:rgba(255,77,109,0.4);}
  .session-item span.name{font-size:13.5px;font-weight:600;}
  .session-item span.count{font-size:11px;color:#8FA0DE;}
  .host-main{flex:1;padding:28px 34px;max-width:980px;}
  @media (max-width:900px){.host-wrap{flex-direction:column;} .host-sidebar{width:100%;flex-direction:row;overflow-x:auto;align-items:center;} .host-main{padding:20px;}}

  .card{background:var(--paper-2);border:1px solid var(--border);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow);}
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:0.03em;}
  .field input[type=text], .field input[type=number], .field textarea, .field select{
    width:100%;padding:11px 13px;border-radius:10px;border:1.5px solid var(--border);font-size:14.5px;background:var(--paper);
  }
  .field input:focus, .field textarea:focus, .field select:focus{border-color:var(--violet);background:white;}

  .board-type-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:18px;}
  .board-type-btn{
    padding:16px 12px;border-radius:12px;border:1.5px solid var(--border);background:var(--paper-2);text-align:left;
  }
  .board-type-btn:hover{border-color:var(--violet);}
  .board-type-btn .ico{font-size:20px;display:block;margin-bottom:8px;}
  .board-type-btn b{display:block;font-size:13.5px;margin-bottom:2px;}
  .board-type-btn span{font-size:11.5px;color:var(--muted);}

  /* ---- lateral visual de tipos de quadro ---- */
  .session-layout{display:flex;gap:26px;align-items:flex-start;}
  .session-main{flex:1;min-width:0;}
  .type-sidebar{width:248px;flex:none;position:sticky;top:24px;}
  .type-sidebar h4{font-size:11px;text-transform:uppercase;letter-spacing:0.06em;color:var(--muted);margin:0 0 10px;font-weight:700;}
  .type-sidebar .hint{font-size:12px;color:var(--muted);margin:0 0 14px;line-height:1.5;}
  .type-card{
    display:flex;gap:12px;align-items:center;width:100%;text-align:left;
    padding:13px 14px;border-radius:14px;border:1.5px solid var(--border);background:var(--paper-2);
    margin-bottom:10px;transition:transform .14s ease, box-shadow .14s ease, border-color .14s ease;
  }
  .type-card:hover{transform:translateX(-3px);box-shadow:var(--shadow);border-color:var(--type-accent, var(--violet));}
  .type-card .ico-badge{
    width:42px;height:42px;border-radius:11px;display:flex;align-items:center;justify-content:center;
    font-size:19px;flex:none;background:var(--type-accent, var(--violet));
  }
  .type-card .txt{min-width:0;}
  .type-card .txt b{display:block;font-size:13.5px;margin-bottom:2px;color:var(--text-dark);}
  .type-card .txt span{font-size:11px;color:var(--muted);line-height:1.4;display:block;}
  @media (max-width:900px){
    .session-layout{flex-direction:column-reverse;}
    .type-sidebar{width:100%;position:static;}
    .type-sidebar .type-row{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;}
    .type-sidebar .type-row .type-card{flex:none;width:210px;margin-bottom:0;}
  }

  .board-row{
    display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:12px 14px;border:1px solid var(--border);border-radius:12px;margin-bottom:8px;background:var(--paper-2);
  }
  .board-row .tag{
    font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:0.04em;padding:4px 8px;border-radius:6px;color:white;flex:none;white-space:nowrap;order:1;
  }
  .board-row .title{flex:1 1 140px;min-width:110px;font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;order:2;}
  .board-row .meta{font-size:12px;color:var(--muted);flex:none;white-space:nowrap;order:3;}
  .board-row .actions{display:flex;gap:4px;flex:none;margin-left:auto;order:4;}
  @media (max-width:480px){
    .board-row .title{flex-basis:100%;white-space:normal;order:2;}
    .board-row .meta{order:3;}
    .board-row .actions{margin-left:0;order:4;}
  }

  .tag-mc{background:var(--violet);}
  .tag-wc{background:var(--ink-3);}
  .tag-rank{background:#FF9F45;}
  .tag-open{background:#4E8CFF;}
  .tag-quiz{background:var(--coral);color:var(--on-mint) !important;}

  /* live control */
  .live-banner{
    display:flex;align-items:center;justify-content:space-between;gap:16px;
    background:var(--ink);color:white;border-radius:var(--radius);padding:18px 22px;margin-bottom:22px;
    flex-wrap:wrap;
  }
  .room-code-chip{
    font-family:'JetBrains Mono',monospace;font-size:clamp(16px,3vw,26px);font-weight:700;letter-spacing:0.1em;
    background:rgba(255,255,255,0.08);padding:8px 16px;border-radius:10px;word-break:break-all;max-width:280px;
  }
  .live-stats{display:flex;gap:22px;}
  .live-stats div{text-align:center;}
  .live-stats .num{font-size:20px;font-weight:700;font-family:'Space Grotesk',sans-serif;}
  .live-stats .lbl{font-size:10.5px;color:#8FA0DE;text-transform:uppercase;letter-spacing:0.05em;}
  .quick-jump-bar{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:18px;}
  .quick-jump-item{
    flex:none;display:flex;align-items:center;gap:7px;padding:8px 13px;border-radius:10px;
    background:var(--paper-2);border:1.5px solid var(--border);border-top:3px solid var(--qj-accent,var(--border));
    font-size:12.5px;font-weight:600;color:var(--muted);white-space:nowrap;
  }
  .quick-jump-item.active{color:var(--text-dark);border-color:var(--qj-accent,var(--violet));background:var(--paper);box-shadow:var(--shadow);}
  .quick-jump-item:hover{color:var(--text-dark);}

  .bar-row{margin-bottom:14px;}
  .bar-row .bar-label{display:flex;justify-content:space-between;font-size:14px;font-weight:600;margin-bottom:6px;}
  .bar-track{height:34px;background:var(--paper);border-radius:8px;overflow:hidden;border:1px solid var(--border);}
  .bar-fill{height:100%;background:linear-gradient(90deg,var(--violet),var(--ink-3));border-radius:8px;transition:width .4s ease;min-width:2px;}
  .bar-fill.correct{background:linear-gradient(90deg,var(--aqua),#1fae9e);}

  .word-cloud{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:center;padding:20px;}
  .word-cloud span{font-weight:700;font-family:'Space Grotesk',sans-serif;color:var(--text-dark);}

  .empty-state{text-align:center;padding:50px 20px;color:var(--muted);}
  .empty-state .ico{font-size:34px;margin-bottom:10px;display:block;}

  /* ---------- participant ---------- */
  .p-wrap{max-width:480px;margin:0 auto;padding:22px 18px 60px;min-height:100vh;}
  .p-header{text-align:center;margin-bottom:26px;}
  .p-header .brand{justify-content:center;margin-bottom:6px;}
  .p-code{
    display:inline-block;background:var(--ink);color:white;font-family:'JetBrains Mono',monospace;
    padding:6px 12px;border-radius:8px;font-size:13px;letter-spacing:0.1em;margin-top:6px;
  }
  .opt-btn{
    width:100%;text-align:left;padding:16px 18px;border-radius:14px;border:1.5px solid var(--border);
    background:var(--paper-2);margin-bottom:10px;font-size:15.5px;font-weight:600;
    display:flex;align-items:center;gap:12px;transition:all .12s ease;
  }
  .opt-btn .letter{
    width:28px;height:28px;border-radius:8px;background:var(--paper);display:flex;align-items:center;justify-content:center;
    font-size:12.5px;font-weight:700;flex:none;color:var(--muted);
  }
  .opt-btn:active{transform:scale(0.98);}
  .opt-btn.selected{border-color:var(--violet);background:#F1EEFF;}
  .opt-btn.selected .letter{background:var(--violet);color:white;}
  .opt-btn.correct{border-color:var(--aqua);background:#E9FBF8;}
  .opt-btn.correct .letter{background:var(--aqua);color:white;}
  .opt-btn.wrong{border-color:var(--warn);background:#FDEEF0;}
  .opt-btn.wrong .letter{background:var(--warn);color:white;}
  .opt-btn:disabled{opacity:0.85;}

  .timer-ring{
    width:64px;height:64px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:20px;
    background:conic-gradient(var(--violet) calc(var(--pct,100)*1%), var(--border) 0);
    margin:0 auto 18px;position:relative;
  }
  .timer-ring::after{content:'';position:absolute;inset:6px;border-radius:50%;background:var(--paper-2);}
  .timer-ring b{position:relative;z-index:1;}

  .rank-item{
    display:flex;align-items:center;gap:12px;padding:14px;border-radius:12px;border:1.5px solid var(--border);
    background:var(--paper-2);margin-bottom:8px;
  }
  .rank-item .handle{color:var(--muted);font-size:18px;flex:none;}
  .rank-item .pos{
    width:26px;height:26px;border-radius:7px;background:var(--paper);display:flex;align-items:center;justify-content:center;
    font-size:12px;font-weight:700;flex:none;
  }
  .rank-item .txt{flex:1;font-size:14.5px;font-weight:600;}
  .rank-arrows{display:flex;flex-direction:column;gap:2px;}
  .rank-arrows button{background:var(--paper);border-radius:5px;width:24px;height:22px;font-size:11px;color:var(--text-dark);}

  .p-status{
    text-align:center;padding:50px 20px;
  }
  .p-status .big-ico{font-size:44px;margin-bottom:14px;}
  .p-status h2{margin:0 0 8px;font-size:20px;}
  .p-status p{color:var(--muted);font-size:14px;margin:0;}

  textarea.open-input{min-height:100px;resize:vertical;}

  .idea-card{
    background:var(--paper-2);border:1.5px solid var(--border);border-radius:14px;padding:14px 16px;margin-bottom:10px;
    display:flex;justify-content:space-between;align-items:flex-start;gap:12px;
  }
  .idea-card p{margin:0;font-size:14px;line-height:1.5;flex:1;}
  .upvote-btn{
    flex:none;display:flex;flex-direction:column;align-items:center;gap:2px;
    background:var(--paper);border-radius:10px;padding:8px 12px;font-weight:700;font-size:13px;border:1.5px solid var(--border);
  }
  .upvote-btn.voted{background:#FFF3D6;border-color:var(--gold);color:#8a6600;}

  /* ---------- telão ---------- */
  .telao{
    min-height:100vh;background:radial-gradient(circle at 80% 0%, #173796 0%, var(--ink) 55%, #04061a 100%);
    color:white;display:flex;flex-direction:column;
  }
  .telao-top{
    display:flex;align-items:center;justify-content:space-between;padding:20px 36px;
  }
  .telao-top .brand{color:white;font-size:18px;}
  .telao-meta{display:flex;align-items:center;gap:26px;font-family:'JetBrains Mono',monospace;}
  .telao-meta .chip{background:rgba(255,255,255,0.08);padding:8px 16px;border-radius:10px;font-size:15px;letter-spacing:0.08em;}
  .telao-body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px 40px 60px;text-align:center;}
  .telao-body h2.qtitle{font-size:clamp(24px,3.6vw,42px);margin:0 0 40px;max-width:1000px;font-weight:700;}
  .telao-bars{width:100%;max-width:900px;}
  .telao-bar-row{margin-bottom:22px;text-align:left;}
  .telao-bar-row .lab{display:flex;justify-content:space-between;font-size:19px;font-weight:600;margin-bottom:8px;}
  .telao-bar-track{height:52px;background:rgba(255,255,255,0.08);border-radius:12px;overflow:hidden;}
  .telao-bar-fill{height:100%;background:linear-gradient(90deg,var(--violet),var(--ink-3));display:flex;align-items:center;padding:0 16px;
    font-family:'JetBrains Mono',monospace;font-weight:700;color:white;transition:width .5s ease;min-width:48px;}
  .telao-bar-fill.correct{background:linear-gradient(90deg,var(--aqua),#1fae9e);}
  .telao-cloud span{font-family:'Space Grotesk',sans-serif;font-weight:700;}
  .telao-idea{background:rgba(255,255,255,0.06);border-radius:14px;padding:16px 22px;margin-bottom:12px;text-align:left;
    display:flex;justify-content:space-between;gap:16px;align-items:center;font-size:17px;max-width:900px;width:100%;}
  .telao-idea .v{font-family:'JetBrains Mono',monospace;color:var(--gold);font-weight:700;flex:none;}
  .podium{display:flex;align-items:flex-end;gap:22px;justify-content:center;margin-top:20px;}
  .podium .p-col{display:flex;flex-direction:column;align-items:center;gap:10px;}
  .podium .p-col .medal{font-size:34px;}
  .podium .p-col .name{font-weight:700;font-size:16px;}
  .podium .p-col .pts{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--gold);margin-top:2px;}
  .podium-rest{margin:26px auto 0;max-width:420px;width:100%;}
  .podium-rest-row{display:flex;align-items:center;gap:12px;padding:8px 4px;border-bottom:1px solid rgba(255,255,255,0.08);font-size:14px;}
  .podium-rest-row .pos{color:#8FA0DE;font-family:'JetBrains Mono',monospace;width:28px;flex:none;}
  .podium-rest-row .name{flex:1;text-align:left;color:#fff;font-weight:600;}
  .podium-rest-row .pts{font-family:'JetBrains Mono',monospace;color:var(--gold);flex:none;}
  .confetti-piece{position:fixed;top:-20px;width:9px;height:14px;opacity:0.9;z-index:50;pointer-events:none;animation:confetti-fall linear forwards;}
  @keyframes confetti-fall{
    0%{transform:translateY(0) rotate(0deg);opacity:1;}
    100%{transform:translateY(105vh) rotate(540deg);opacity:0.4;}
  }
  @keyframes lb-fade-in{from{opacity:0;transform:translateX(-8px);}to{opacity:1;transform:translateX(0);}}
  @keyframes lb-bounce{0%,100%{transform:translateY(0);}50%{transform:translateY(-4px);}}
  .podium .p-col .bar{width:120px;border-radius:12px 12px 0 0;background:linear-gradient(180deg,var(--gold),#c9a02a);}
  .podium .p-col.p1 .bar{height:150px;}
  .podium .p-col.p2 .bar{height:110px;background:linear-gradient(180deg,#D9DCE8,#9599B0);}
  .podium .p-col.p3 .bar{height:80px;background:linear-gradient(180deg,#E3A15D,#B87536);}
  .join-hero{display:flex;flex-direction:column;align-items:center;gap:22px;}
  .join-hero .code-huge{font-family:'JetBrains Mono',monospace;font-size:clamp(32px,9vw,100px);font-weight:700;letter-spacing:0.06em;color:var(--coral);word-break:break-all;max-width:95vw;line-height:1.1;}
  .qr-box{background:white;padding:16px;border-radius:16px;}
  .toast{
    position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:white;
    padding:12px 22px;border-radius:12px;font-size:14px;font-weight:600;box-shadow:var(--shadow);z-index:100;
    opacity:0;transition:opacity .25s ease;pointer-events:none;
  }
  .toast.show{opacity:1;}
  .modal-bg{position:fixed;inset:0;background:rgba(20,19,43,0.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;}
  .modal-box{background:var(--paper-2);border-radius:20px;padding:26px;max-width:440px;width:100%;max-height:85vh;overflow-y:auto;}
  .modal-box h3{margin-top:0;}

  .modal-box{position:relative;}

        } else {

      var max = size - margin;

      img += '\u0020src="';
      img += _this.createDataURL(cellSize, margin);
      img += '"';
      img += '\u0020width="';
      img += size;
      img += '"';
      img += '\u0020height="';
      img += size;
      img += '"';
      if (alt) {
        img += '\u0020alt="';
        img += escapeXml(alt);
        img += '"';
      }
      img += '/>';

      return img;
    };

    var escapeXml = function(s) {
      var escaped = '';
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charAt(i);
        switch(c) {
        case '<': escaped += '&lt;'; break;
        case '>': escaped += '&gt;'; break;
        case '&': escaped += '&amp;'; break;
        case '"': escaped += '&quot;'; break;
        default : escaped += c; break;
        }
      }
      return escaped;
    };

    var _createHalfASCII = function(margin) {
      var cellSize = 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r1, r2, p;

      var blocks = {
        '██': '█',
        '█ ': '▀',
        ' █': '▄',
        '  ': ' '

      var blocksLastLineNoMargin = {

        '█ ': '▀',
        ' █': ' ',
        '  ': ' '

      var ascii = '';

        r2 = Math.floor((y + 1 - min) / cellSize);

          if (min <= x && x < max && min <= y+1 && y+1 < max && _this.isDark(r2, Math.floor((x - min) / cellSize))) {

          else {
            p += '█';

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r, p;

      var white = Array(cellSize+1).join('██');
      var black = Array(cellSize+1).join('  ');

      var ascii = '';
      var line = '';
      for (y = 0; y < size; y += 1) {
        r = Math.floor( (y - min) / cellSize);
        line = '';
        for (x = 0; x < size; x += 1) {
          p = 1;

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r, Math.floor((x - min) / cellSize))) {

  // qrcode.stringToBytes
  //---------------------------------------------------------------------

  qrcode.stringToBytesFuncs = {

  qrcode.createStringToBytes = function(unicodeData, numChars) {

    var unicodeMap = function() {

      var bin = base64DecodeInputStream(unicodeData);

        var b = bin.read();
        if (b == -1) throw 'eof';
        return b;
      };

      var count = 0;
      var unicodeMap = {};
      while (true) {
        var b0 = bin.read();
        if (b0 == -1) break;
        var b1 = read();
        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);
        var v = (b2 << 8) | b3;
        unicodeMap[k] = v;
        count += 1;
      }
      if (count != numChars) {
        throw count + ' != ' + numChars;
      }

      return unicodeMap;
    }();

    var unknownChar = '?'.charCodeAt(0);

    return function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);
        } else {
          var b = unicodeMap[s.charAt(i)];
          if (typeof b == 'number') {
            if ( (b & 0xff) == b) {
              // 1byte
              bytes.push(b);
            } else {
              // 2bytes
              bytes.push(b >>> 8);
              bytes.push(b & 0xff);
            }

          }

const toastEl = document.getElementById('toast');
function toast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>toastEl.classList.remove('show'), 2400);
}
function uid(len=8){
  const chars='abcdefghjkmnpqrstuvwxyz23456789';
  let s='';for(let i=0;i<len;i++)s+=chars[Math.floor(Math.random()*chars.length)];
  return s;
}

/* ---- IA: gerar quadros e assistente de escrita ---- */
async function callClaude(systemPrompt, userPrompt){
  const response = await fetch("https://api.anthropic.com/v1/messages", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({ model:"claude-sonnet-4-6", max_tokens:1500, system:systemPrompt, messages:[{role:"user", content:userPrompt}] })
  });
  const data = await response.json();
  const textBlock = (data.content||[]).find(b=>b.type==='text');
  if(!textBlock) throw new Error('Resposta vazia da IA');
  return textBlock.text;
}
function parseAIJson(text){
  const clean = text.replace(/```json|```/g,'').trim();
  return JSON.parse(clean);
}

  </div>`;
  document.getElementById('aiTopic').focus();

async function runAIGenerate(){
  const type = document.getElementById('aiType').value;
  const topic = document.getElementById('aiTopic').value.trim();
  const count = Math.max(2, Math.min(10, parseInt(document.getElementById('aiCount').value)||5));
  if(!topic){ toast('Descreva o tema primeiro.'); return; }
  const btn = document.getElementById('aiGenBtn');
  const statusEl = document.getElementById('aiStatus');
  btn.disabled = true; btn.textContent = 'Gerando...';
  statusEl.textContent = 'A IA está montando as perguntas...';
  try{
    let board;
    if(type==='quiz'){
      const sys = `Você gera quizzes em português do Brasil para eventos e treinamentos. Responda APENAS com JSON válido, sem markdown e sem texto fora do JSON, exatamente neste formato: {"title":"nome curto do quiz","questions":[{"text":"pergunta","options":["a","b","c","d"],"correctIndex":0,"timeLimitSec":20}]}. Gere exatamente ${count} perguntas de múltipla escolha com 4 alternativas plausíveis cada (só uma correta), sobre o tema informado.`;
      const parsed = parseAIJson(await callClaude(sys, `Tema: ${topic}`));
      if(!parsed.questions || !parsed.questions.length) throw new Error('Formato inesperado');
      board = { id: uid(6), type:'quiz', title: parsed.title || `Quiz — ${topic}`,
        questions: parsed.questions.slice(0,10).map(q=>({ id:uid(6), text:q.text||'Pergunta', options:(q.options||['A','B','C','D']).slice(0,6), correctIndex: Math.min(q.correctIndex||0, (q.options||[]).length-1), timeLimitSec: q.timeLimitSec||20 })) };
    } else {
      const sys = `Você gera enquetes em português do Brasil para eventos. Responda APENAS com JSON válido, sem markdown e sem texto fora do JSON, exatamente neste formato: {"title":"pergunta da enquete","options":["opção 1","opção 2","opção 3"]}. Gere entre 3 e 5 alternativas curtas e relevantes sobre o tema informado.`;
      const parsed = parseAIJson(await callClaude(sys, `Tema: ${topic}`));
      if(!parsed.options || !parsed.options.length) throw new Error('Formato inesperado');
      board = { id: uid(6), type:'multipla_escolha', title: parsed.title || topic, options: parsed.options.slice(0,8) };
    }
    const s = hostState.currentSession;
    s.boards.push(board);
    await saveCurrentSession();
    document.getElementById('globalModalRoot').innerHTML = '';
    toast('✨ Quadro gerado! Revise antes de usar ao vivo.');
    renderHostMain();
  }catch(e){
    console.error('AI generate failed', e);
    toast('Não deu para gerar agora. Tente de novo ou crie manualmente.');
    btn.disabled = false; btn.textContent = 'Gerar';
    statusEl.textContent = '';
  }
}

async function runAIFromSlides(){
  const text = document.getElementById('aiSlidesText').value.trim();
  const count = Math.max(2, Math.min(8, parseInt(document.getElementById('aiSlidesCount').value)||4));
  if(!text){ toast('Cole o roteiro da apresentação primeiro.'); return; }
  const btn = document.getElementById('aiSlidesBtn');
  const statusEl = document.getElementById('aiSlidesStatus');
  btn.disabled = true; btn.textContent = 'Gerando...';
  statusEl.textContent = 'A IA está analisando o roteiro...';
  try{
    const sys = `Você analisa o roteiro de uma apresentação (tópicos ou texto de slides) em português do Brasil e sugere quadros interativos para engajar o público nos pontos certos, ao longo da apresentação. Responda APENAS com JSON válido, sem markdown e sem texto fora do JSON, exatamente neste formato: {"boards":[{"type":"multipla_escolha","title":"pergunta da enquete","options":["opção 1","opção 2","opção 3"]},{"type":"quiz","title":"nome do quiz","questions":[{"text":"pergunta","options":["a","b","c","d"],"correctIndex":0,"timeLimitSec":20}]}]}. Cada item de "boards" deve ser do tipo "multipla_escolha" (enquete de opinião, com 3 a 5 opções) ou "quiz" (com 1 a 2 perguntas, para fixar conteúdo) — escolha o tipo mais adequado a cada trecho do roteiro. Gere exatamente ${count} quadros, na ordem em que fariam sentido durante a apresentação.`;
    const parsed = parseAIJson(await callClaude(sys, text));
    if(!parsed.boards || !parsed.boards.length) throw new Error('Formato inesperado');
    const s = hostState.currentSession;
    parsed.boards.slice(0,8).forEach(b=>{
      if(b.type==='quiz' && b.questions && b.questions.length){
        s.boards.push({ id: uid(6), type:'quiz', title: b.title||'Quiz',
          questions: b.questions.slice(0,5).map(q=>({ id:uid(6), text:q.text||'Pergunta', options:(q.options||['A','B','C','D']).slice(0,6), correctIndex: Math.min(q.correctIndex||0,(q.options||[]).length-1), timeLimitSec:q.timeLimitSec||20 })) });
      } else if(b.options && b.options.length){
        s.boards.push({ id: uid(6), type:'multipla_escolha', title: b.title||'Enquete', options: b.options.slice(0,8) });
      }
    });
    await saveCurrentSession();
    document.getElementById('globalModalRoot').innerHTML = '';
    toast(`✨ ${parsed.boards.length} quadros gerados! Revise a ordem antes de usar ao vivo.`);
    renderHostMain();
  }catch(e){
    console.error('AI from slides failed', e);
    toast('Não deu para gerar agora. Tente de novo ou crie manualmente.');
    btn.disabled = false; btn.textContent = 'Gerar quadros';
    statusEl.textContent = '';
  }
}
async function improveQuizQWithAI(qi, btnEl){

  btnEl.disabled = true; btnEl.textContent = '✨ Melhorando...';
  try{
    const sys = `Você reformula perguntas de quiz em português do Brasil, deixando-as claras, envolventes e fáceis de entender, sem mudar o sentido original. Responda APENAS com a pergunta reformulada, sem aspas, sem explicação, sem markdown.`;
    const improved = (await callClaude(sys, input.value.trim())).trim();

   funciona pra qualquer visitante sem conta e sem tela de login) ---- */
const FIREBASE_CONFIG = {
  apiKey: 'AIzaSyBN7e6IgIM-reET19FGtvgzeuylwH5T13Y',
  authDomain: 'interage-pracelerar.firebaseapp.com',
  databaseURL: 'https://interage-pracelerar-default-rtdb.europe-west1.firebasedatabase.app',
  projectId: 'interage-pracelerar',
  storageBucket: 'interage-pracelerar.firebasestorage.app',
  messagingSenderId: '725640992920',
  appId: '1:725640992920:web:8757ca3528ac11708b58ed'
};
let fbDb = null, fbUid = null, fbReadyPromise = null;
function fbConfigured(){
  return !!(FIREBASE_CONFIG.apiKey && FIREBASE_CONFIG.databaseURL);
}
function initFirebase(){
  if(fbReadyPromise) return fbReadyPromise;
  fbReadyPromise = (async ()=>{
    if(!fbConfigured()) throw new Error('Firebase não configurado ainda');
    if(typeof firebase === 'undefined') throw new Error('Biblioteca do Firebase não carregou (bloqueio de rede/CDN)');
    if(!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
    fbDb = firebase.database();
    await firebase.auth().signInAnonymously();
    fbUid = firebase.auth().currentUser.uid;
  })();
  fbReadyPromise.catch(()=>{ fbReadyPromise = null; }); // não trava permanentemente — tenta de novo na próxima chamada
  return fbReadyPromise;
}
function fbSafeKey(key){
  return String(key).replace(/[.#$\[\]]/g, '_');
}
function fbPath(key, shared){
  return (shared ? 'shared/' : 'users/'+(fbUid||'anon')+'/') + fbSafeKey(key);
}
async function sGet(key, shared){
  try{
    await withTimeout(initFirebase(), 9000);
    const snap = await withTimeout(fbDb.ref(fbPath(key,shared)).once('value'), 9000);
    const val = snap.val();
    return val==null ? null : JSON.parse(val);
  }catch(e){ return null; }
}
async function sSet(key, value, shared, attempt){
  attempt = attempt || 0;
  try{
    await withTimeout(initFirebase(), 9000);
    await withTimeout(fbDb.ref(fbPath(key,shared)).set(JSON.stringify(value)), 9000);
    return {key,value,shared};
  }
  catch(e){
    if(attempt < 3){
      console.warn('storage set: tentando de novo (tentativa '+(attempt+1)+'/4)', key);
      const delay = [600, 1500, 3000][attempt];
      if(attempt === 1) toast('⏳ Conexão lenta, tentando salvar de novo...');
      await new Promise(r=>setTimeout(r, delay));
      return sSet(key, value, shared, attempt+1);
    }
    console.error('storage set failed after 4 attempts', key, e);
    toast('⚠️ Não deu para salvar agora (falha de conexão). Verifique sua internet e tente de novo em instantes.');
    return null;
  }
}
async function sList(prefix, shared){
  try{
    await withTimeout(initFirebase(), 9000);
    const base = shared ? 'shared' : 'users/'+(fbUid||'anon');
    const safePrefix = fbSafeKey(prefix);
    const snap = await withTimeout(
      fbDb.ref(base).orderByKey().startAt(safePrefix).endAt(safePrefix+'\uf8ff').once('value'),
      9000
    );
    const out = [];
    snap.forEach(child=>{ out.push(child.key); });
    return out;
  }catch(e){ return []; }
}
async function sDelete(key, shared){
  try{
    await withTimeout(initFirebase(), 9000);
    await withTimeout(fbDb.ref(fbPath(key,shared)).remove(), 9000);
    return {deleted:true};
  }catch(e){ console.error('storage delete failed', key, e); return null; }
}
async function sGetMany(keys, shared){
  const out = [];
  const chunks = [];
  for(let i=0;i<keys.length;i+=40) chunks.push(keys.slice(i,i+40));
  for(const chunk of chunks){
    const vals = await Promise.all(chunk.map(k=>sGet(k, shared)));
    chunk.forEach((k,i)=>{ if(vals[i]!==null) out.push({key:k, value:vals[i]}); });
  }
  return out;
}

/* Armazenamento: 'session_index' guarda só {id,name,boardCount} de todas as sessões (gravação leve).
   Cada sessão completa (com os quadros) fica em sua própria chave 'session:<id>' — assim, editar
   uma sessão nunca precisa reenviar as outras, e uma falha de gravação afeta só a sessão em edição. */
let hostState = { sessionIndex:[], activeSessionId:null, currentSession:null, activeRoomCode:null, room:null };

async function loadSessionIndex(){
  const idx = await sGet('session_index', true);
  hostState.sessionIndex = idx || [];
}
async function saveSessionIndex(){
  await sSet('session_index', hostState.sessionIndex, true);
}
async function fetchFullSession(id){
  const shell = await sGet('session:'+id, true);
  if(!shell) return null;
  if(Array.isArray(shell.boards)){
    // formato antigo (compatibilidade): quadros já embutidos na sessão
    return shell;
  }
  const boardIds = shell.boardIds || [];
  let orderedBoards = [];
  if(boardIds.length){
    const fetched = await sGetMany(boardIds.map(bid=>'board:'+id+':'+bid), true);
    const boardMap = {};
    fetched.forEach(item=>{ boardMap[item.key.split(':').pop()] = item.value; });
    orderedBoards = boardIds.map(bid=>boardMap[bid]).filter(Boolean);
  }
  return { ...shell, boards: orderedBoards };
}
async function loadCurrentSession(id){
  hostState.currentSession = await fetchFullSession(id);
}
async function saveCurrentSession(){
  if(!hostState.currentSession) return;
  const s = hostState.currentSession;
  const shell = { id:s.id, name:s.name, boardIds:s.boards.map(b=>b.id), createdAt:s.createdAt, createdBy:s.createdBy, lastRoomCode:s.lastRoomCode, theme:s.theme, anonymous:s.anonymous, hideQR:s.hideQR };
  await Promise.all([
    sSet('session:'+s.id, shell, true),
    ...s.boards.map(b => sSet('board:'+s.id+':'+b.id, b, true))
  ]);
  const idxEntry = hostState.sessionIndex.find(e=>e.id===s.id);
  if(idxEntry){
    idxEntry.name = s.name;
    idxEntry.boardCount = s.boards.length;
    idxEntry.lastRoomCode = s.lastRoomCode || idxEntry.lastRoomCode || null;
    saveSessionIndex();
  }
}

  const s = { id: uid(6), name:'Nova sessão', boards:[], createdAt: Date.now(), createdBy: currentUser?.name || 'Anônimo' };

function boardMetaLabel(b){
  let base = '';
  if(b.type==='quiz') base = `${b.questions.length} pergunta${b.questions.length===1?'':'s'}`;
  else if(b.type==='multipla_escolha' || b.type==='ranking') base = `${b.options.length} opções`;
  else if(b.type==='nuvem_palavras') base = 'palavra livre';
  else if(b.type==='texto_aberto') base = 'mural de texto';
  if(b.expiresAt){
    const d = new Date(b.expiresAt);
    const pad = n => String(n).padStart(2,'0');
    base += isBoardExpired(b) ? ` · ⏰ expirado em ${pad(d.getDate())}/${pad(d.getMonth()+1)} ${pad(d.getHours())}:${pad(d.getMinutes())}` : ` · ⏰ até ${pad(d.getDate())}/${pad(d.getMonth()+1)} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }
  return base;
}
async function deleteSession(){
  showConfirm('Excluir esta sessão e todos os seus quadros?', async ()=>{
    const idToDelete = hostState.activeSessionId;
    if(hostState.activeRoomCode && hostState.room && hostState.room.sessionId===idToDelete){
      await sSet('room:'+hostState.activeRoomCode, {...hostState.room, status:'ended'}, true);
      hostState.activeRoomCode = null;
      hostState.room = null;
    }
    // apaga cada quadro salvo individualmente antes de apagar a sessão
    const boardsToDelete = hostState.currentSession?.id===idToDelete ? (hostState.currentSession.boards||[]) : [];
    await Promise.all(boardsToDelete.map(b => sDelete('board:'+idToDelete+':'+b.id, true)));
    hostState.sessionIndex = hostState.sessionIndex.filter(s=>s.id!==idToDelete);
    hostState.activeSessionId = hostState.sessionIndex[0]?.id || null;
    await saveSessionIndex();
    await sDelete('session:'+idToDelete, true);
    if(hostState.activeSessionId) await loadCurrentSession(hostState.activeSessionId);
    else hostState.currentSession = null;
    renderHostUI();
  });
}
function removeBoard(i){
  const s = hostState.currentSession;
  const removed = s.boards[i];
  s.boards.splice(i,1);
  saveCurrentSession();
  if(removed) sDelete('board:'+s.id+':'+removed.id, true);
  renderHostMain();
}
function moveBoard(i, dir){
  const s = hostState.currentSession;
  const j = i+dir;
  if(j<0 || j>=s.boards.length) return;
  [s.boards[i], s.boards[j]] = [s.boards[j], s.boards[i]];
  saveCurrentSession(); renderHostMain();
}
function duplicateBoard(i){
  const s = hostState.currentSession;
  const copy = JSON.parse(JSON.stringify(s.boards[i]));
  copy.id = uid(6);
  copy.title = copy.title + ' (cópia)';
  if(copy.questions) copy.questions.forEach(q=>q.id=uid(6));
  s.boards.splice(i+1, 0, copy);
  saveCurrentSession(); renderHostMain();
}

/* ---- board editor modal (com autosave) ---- */
function closeModal(){ document.getElementById('boardModalRoot').innerHTML=''; }
let autosaveTimer = null;
function scheduleAutosave(){ clearTimeout(autosaveTimer); autosaveTimer = setTimeout(persistDraft, 700); }
async function persistDraft(){
  if(!editDraft) return;
  const s = hostState.currentSession;
  if(!s) return;
  const clean = JSON.parse(JSON.stringify(editDraft));
  delete clean._index;
  let isNewBoard = false;
  if(editDraft._index===-1 || editDraft._index===undefined){
    s.boards.push(clean);
    editDraft._index = s.boards.length-1;
    isNewBoard = true;
  } else {
    s.boards[editDraft._index] = clean;
  }
  // salva só este quadro (gravação leve) — a sessão inteira não é reenviada a cada edição
  const writes = [ sSet('board:'+s.id+':'+clean.id, clean, true) ];
  if(isNewBoard){
    const shell = { id:s.id, name:s.name, boardIds:s.boards.map(b=>b.id), createdAt:s.createdAt, createdBy:s.createdBy, lastRoomCode:s.lastRoomCode, theme:s.theme, anonymous:s.anonymous, hideQR:s.hideQR };
    writes.push(sSet('session:'+s.id, shell, true));
  }
  await Promise.all(writes);
  const idxEntry = hostState.sessionIndex.find(e=>e.id===s.id);
  if(idxEntry && idxEntry.boardCount!==s.boards.length){ idxEntry.boardCount = s.boards.length; saveSessionIndex(); }
  const st = document.getElementById('autosaveStatus');
  if(st){ st.textContent = 'Salvo agora'; clearTimeout(st._t); st._t = setTimeout(()=>{ if(document.getElementById('autosaveStatus')) document.getElementById('autosaveStatus').textContent='Alterações salvas automaticamente'; }, 1400); }
}
async function closeBoardEditor(){
  clearTimeout(autosaveTimer);
  await persistDraft();
  editDraft = null;
  closeModal();
  renderHostMain();
}

let editDraft = null;
function toLocalDatetimeValue(ts){
  const d = new Date(ts);
  const pad = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function updateExpiresAt(val){
  editDraft.expiresAt = val ? new Date(val).getTime() : null;
  scheduleAutosave();
}
function isBoardExpired(board){
  return !!(board.expiresAt && Date.now() > board.expiresAt);
}
let collapsedQ = new Set();
function editBoard(index, forceType){
  const s = hostState.currentSession;
  const existing = index>=0 ? s.boards[index] : null;
  const type = forceType || existing.type;
  editDraft = existing ? JSON.parse(JSON.stringify(existing)) : blankBoard(type);
  editDraft._index = index;
  collapsedQ = new Set();
  renderBoardEditor();
  if(index===-1) persistDraft(); // já cria o quadro salvo, mesmo em branco
}
function blankBoard(type){
  const base = {id: uid(6), type, title:''};
  if(type==='multipla_escolha') return {...base, title:'Nova enquete', options:['Opção 1','Opção 2']};
  if(type==='nuvem_palavras') return {...base, title:'Descreva em uma palavra'};
  if(type==='ranking') return {...base, title:'Ordene por prioridade', options:['Item 1','Item 2','Item 3']};
  if(type==='texto_aberto') return {...base, title:'Deixe sua pergunta ou ideia'};
  if(type==='quiz') return {...base, title:'Quiz', questions:[{id:uid(6), text:'Pergunta 1', options:['A','B','C','D'], correctIndex:0, timeLimitSec:20}]};
}

function uploadThemeImage(input, field){

    saveCurrentSession();

async function confirmStartLiveSession(){
  const raw = document.getElementById('customCodeInput').value;
  const code = raw.trim().toUpperCase().replace(/[^A-Z0-9\-]/g,'');
  if(code.length<3){ renderCodeSetupModal(raw, 'O código precisa ter pelo menos 3 caracteres.'); return; }
  const s = hostState.currentSession;
  const existing = await sGet('room:'+code, true);
  if(existing && existing.sessionId!==s.id){ renderCodeSetupModal(raw, 'Esse código já está em uso agora — escolha outro.'); return; }
  const room = { sessionId: s.id, activeBoardIndex: -1, status:'lobby', createdAt: Date.now(), questionStartAt:null, revealed:false };
  const btn = document.querySelector('#globalModalRoot .btn-primary');
  if(btn){ btn.disabled = true; btn.textContent = 'Criando sala...'; }
  const saved = await sSet('room:'+code, room, true);
  if(!saved){
    if(btn){ btn.disabled = false; btn.textContent = 'Iniciar ao vivo'; }
    renderCodeSetupModal(raw, '⚠️ Não deu para criar a sala agora (falha de conexão). Tente de novo.');
    return;
  }
  // confere se a sala realmente ficou gravada antes de assumir que deu certo
  const verify = await sGet('room:'+code, true);
  if(!verify){
    if(btn){ btn.disabled = false; btn.textContent = 'Iniciar ao vivo'; }
    renderCodeSetupModal(raw, '⚠️ A sala não foi confirmada no servidor. Tente de novo antes de compartilhar o código.');
    return;
  }
  s.lastRoomCode = code;
  await saveCurrentSession();
  hostState.activeRoomCode = code;
  hostState.room = room;
  document.getElementById('globalModalRoot').innerHTML = '';
  renderHostMain();
}

  hostState.room = await sGet('room:'+hostState.activeRoomCode, true);

async function saveRoomState(){
  const saved = await sSet('room:'+hostState.activeRoomCode, hostState.room, true);
  if(!saved) toast('⚠️ Essa ação pode não ter chegado à sala por falha de conexão. Confira se os participantes veem a atualização.');
  return saved;
}
async function advanceBoard(){
  const s = hostState.currentSession;
  const next = hostState.room.activeBoardIndex + 1;
  if(next >= s.boards.length){
    hostState.room.status='ended';
    hostState.room.completed=true;
  } else {
    hostState.room.activeBoardIndex = next;
    hostState.room.status='live';
    hostState.room.revealed=false;
    const board = s.boards[next];
    hostState.room.activeQuestionIndex = board.type==='quiz' ? 0 : null;
    hostState.room.questionStartAt = board.type==='quiz' ? Date.now() : null;
  }
  await saveRoomState();
  renderHostLive();
}

// Endereço público fixo deste app, embutido diretamente no código —
// do mesmo jeito que o Slido tem o próprio domínio fixo, sem precisar perguntar a ninguém.
// Preencher com o link gerado ao publicar (ex: 'https://claude.ai/public/artifacts/xxxxx').
const PUBLISHED_URL = ''; // agora hospedado fora do Claude (GitHub Pages) — o app detecta o endereço sozinho
function safeBaseUrl(){
  if(PUBLISHED_URL) return PUBLISHED_URL;
  if(location.origin && location.origin.indexOf('http')===0){
    return location.origin + location.pathname;
  }
  return null;
}
function bestAvailableBase(){
  const safe = safeBaseUrl();
  if(safe) return safe;
  try{
    const href = (location.href||'').split('#')[0];
    // em contextos sandboxed (sem URL http real), o href pode vir enorme
    // (ex: uma data: URI com o arquivo inteiro) — isso quebra a geração do QR.
    // Nesse caso é mais seguro não usar o href bruto.
    if(href.length > 300) return '';
    return href;
  }catch(e){ return ''; }
}
function openHostTelao(){
  const s = hostState.currentSession;
  const code = hostState.activeRoomCode || s?.lastRoomCode;
  if(!code){ toast('Inicie uma sessão ao vivo primeiro para abrir o telão.'); return; }
  const base = safeBaseUrl();
  if(base){
    window.open(base + '#telao=' + code, '_blank');
  } else {
    toast('Pré-visualização: abrindo o telão nesta mesma aba (em nova aba só funciona depois de publicar/baixar o arquivo).');
    location.hash = 'telao=' + code;
  }
}
async function shareParticipantLink(){
  const code = hostState.activeRoomCode;
  if(!code){ toast('Inicie a sessão ao vivo primeiro.'); return; }
  const base = safeBaseUrl();
  const link = bestAvailableBase() ? bestAvailableBase() + '#participar?sala=' + code : code;
  if(!base){ showLinkModal(link, code); return; }

  }catch(e){
    showLinkModal(link, code);
  }
}
function qrSvgMarkup(link, px){
  if(!link || link.length > 1200){
    // texto longo demais não cabe num QR — não deixa a área vazia sem explicação
    return `<div style="width:${px}px;height:${px}px;display:flex;align-items:center;justify-content:center;text-align:center;padding:16px;color:var(--muted);font-size:12px;box-sizing:border-box;">Não deu para gerar o QR agora. Use o código da sala.</div>`;
  }
  try{
    const qr = qrcode(0, 'M');
    qr.addData(link);
    qr.make();
    let svg = qr.createSvgTag({scalable:true, margin:2});
    return svg.replace('<svg ', `<svg width="${px}" height="${px}" style="display:block;" `);
  }catch(e){
    console.error('QR generation failed', e);
    return `<div style="width:${px}px;height:${px}px;display:flex;align-items:center;justify-content:center;text-align:center;padding:16px;color:var(--muted);font-size:12px;box-sizing:border-box;">Não deu para gerar o QR agora. Use o código da sala.</div>`;
  }
}
function downloadQRCode(link, filename){
  const svg = qrSvgMarkup(link, 800);
  const blob = new Blob([svg], {type:'image/svg+xml'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}

      ${code ? `<div class="room-code-chip" style="background:var(--paper);color:var(--text-dark);display:inline-block;font-size:22px;margin-bottom:14px;">${escapeHtml(code)}</div>` : ''}

function downloadCSV(filename, rows){
  const csv = rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');
  const blob = new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}
async function exportCurrentBoardCSV(){
  const s = hostState.currentSession, room = hostState.room, code = hostState.activeRoomCode;
  if(!s || !room || room.status!=='live'){ toast('Nenhum quadro ao vivo para exportar agora.'); return; }
  const board = s.boards[room.activeBoardIndex];
  let rows = [];
  if(board.type==='quiz'){
    const q = board.questions[room.activeQuestionIndex];
    const answers = await sGetMany(await sList(`qa:${code}:${board.id}:${q.id}:`, true), true);
    rows.push(['Participante','Pergunta','Resposta','Correta?','Tempo (ms)']);
    answers.forEach(a=>{
      const oi = a.value.optionIndex;
      const label = typeof oi==='number' ? `${String.fromCharCode(65+oi)}. ${q.options[oi]??''}` : '';
      rows.push([dispName(a.value.name, s.anonymous), q.text, label, a.value.correct?'Sim':'Não', a.value.timeMs]);
    });
  } else if(board.type==='multipla_escolha'){
    const answers = await sGetMany(await sList(`mc:${code}:${board.id}:`, true), true);
    rows.push(['Participante','Resposta']);
    answers.forEach(a=>{
      const oi = a.value.optionIndex;
      const label = typeof oi==='number' ? `${String.fromCharCode(65+oi)}. ${board.options[oi]??''}` : '';
      rows.push([dispName(a.value.name, s.anonymous), label]);
    });
  } else if(board.type==='nuvem_palavras'){
    const answers = await sGetMany(await sList(`wc:${code}:${board.id}:`, true), true);
    rows.push(['Palavra']);
    answers.forEach(a=> rows.push([a.value.word]));
  } else if(board.type==='ranking'){
    const answers = await sGetMany(await sList(`rk:${code}:${board.id}:`, true), true);
    rows.push(['Participante', ...board.options]);
    answers.forEach(a=>{
      const posByOpt = {};
      (a.value.order||[]).forEach((optIdx,pos)=>{ posByOpt[optIdx]=pos+1; });
      rows.push([dispName(a.value.name, s.anonymous), ...board.options.map((_,oi)=>posByOpt[oi]??'')]);
    });
  } else if(board.type==='texto_aberto'){
    const items = await sGetMany(await sList(`tx:${code}:${board.id}:`, true), true);
    rows.push(['Autor','Texto']);
    items.forEach(it=> rows.push([dispName(it.value.name, s.anonymous), it.value.text]));
  }
  if(rows.length<=1){ toast('Ainda não há respostas para exportar neste quadro.'); return; }
  downloadCSV(`${(board.title||'quadro').replace(/[^a-z0-9]+/gi,'_')}.csv`, rows);
}

    const t = BOARD_TYPES[b.type];
    const active = i===hostState.room.activeBoardIndex;
    const expired = isBoardExpired(b);
    return `<button class="quick-jump-item ${active?'active':''}" style="--qj-accent:${t.accent};${expired?'opacity:0.55;':''}" onclick="jumpToBoard(${i})" title="${escapeAttr(b.title)}${expired?' (expirado)':''}">
      <span>${expired?'⏰':t.ico}</span>${escapeHtml(b.title.length>18?b.title.slice(0,18)+'…':b.title)}
    </button>`;
  }).join('');
  await renderLiveBoardArea();
  POLL = setInterval(async ()=>{ await refreshRoom(); await renderLiveBoardArea(true); }, 4000);
}
function launchConfetti(){
  const colors = ['#2A4FDA','#FFD23F','#2E9E5B','#E8546B','#9FEFBC','#7B8BC4'];
  const count = 90;
  for(let i=0;i<count;i++){
    const el = document.createElement('div');
    el.className = 'confetti-piece';
    const left = Math.random()*100;
    const duration = 2.6 + Math.random()*1.8;
    const delay = Math.random()*0.6;
    const color = colors[Math.floor(Math.random()*colors.length)];
    el.style.left = left+'vw';
    el.style.background = color;
    el.style.borderRadius = Math.random()>0.5 ? '50%' : '2px';
    el.style.animationDuration = duration+'s';
    el.style.animationDelay = delay+'s';
    document.body.appendChild(el);
    setTimeout(()=>el.remove(), (duration+delay)*1000+200);
  }
}
function playFanfare(){
  try{
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if(!Ctx) return;
    const ctx = new Ctx();
    const notes = [523.25, 659.25, 783.99, 1046.5]; // C5 E5 G5 C6
    notes.forEach((freq, i)=>{
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.value = freq;
      const start = ctx.currentTime + i*0.12;
      gain.gain.setValueAtTime(0.0001, start);
      gain.gain.exponentialRampToValueAtTime(0.22, start+0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, start+0.35);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(start); osc.stop(start+0.4);
    });
    setTimeout(()=>ctx.close(), 1200);
  }catch(e){ console.error('playFanfare failed', e); }
}
async function computeQuizScores(code, board){
  const answers = await sGetMany(await sList(`qa:${code}:${board.id}:`, true), true);
  const scoreByP = {};
  answers.forEach(a=>{
    const pid = a.key.split(':').pop();
    const qId = a.key.split(':')[3];
    const q = board.questions.find(qq=>qq.id===qId);
    const pts = a.value.correct ? Math.round(500 + 500*Math.max(0,1-(a.value.timeMs/((q?.timeLimitSec||20)*1000)))) : 0;
    if(!scoreByP[pid]) scoreByP[pid] = {name:a.value.name||'Anônimo', score:0};
    scoreByP[pid].score += pts;
  });
  return Object.values(scoreByP).sort((a,b)=>b.score-a.score);
}

    withVotes.sort((a,b)=>b.votes-a.votes);

        <div class="upvote-btn">👍 ${it.votes}</div></div>`).join('') : `<p style="color:var(--muted);">Aguardando envios...</p>`;
    }
  }

  area.innerHTML = `<div class="card"><span class="tag ${t.tag}">${t.label}</span>

async function joinRoom(){
  const code = document.getElementById('joinCode').value.trim().toUpperCase();
  const name = document.getElementById('joinName').value.trim();
  if(code.length<3){ toast('Digite o código da sala'); return; }
  const btn = document.getElementById('joinBtn');
  if(btn){ btn.disabled = true; btn.textContent = 'Entrando...'; }
  // tenta algumas vezes antes de dizer "não encontrada" — evita falso negativo por instabilidade passageira
  let room = null;
  for(let attempt=0; attempt<3 && !room; attempt++){
    if(attempt>0) await new Promise(r=>setTimeout(r, 700));
    room = await sGet('room:'+code, true);
  }
  if(btn){ btn.disabled = false; btn.textContent = 'Entrar na sala'; }
  if(!room){ toast('Sala não encontrada. Confira o código com o host e tente de novo.'); return; }
  pState.code = code; pState.name = name;
  await sSet(`p:${code}:${pState.id}`, {name, joinedAt:Date.now()}, true);
  pState.joined = true;
  renderParticipant();
}
async function renderParticipantLoop(){
  const main = document.getElementById('pMain');
  if(!main) return;
  const room = await sGet('room:'+pState.code, true);
  if(!room){ main.innerHTML = statusBlock('⚠️','Sala encerrada','O host encerrou esta sessão.'); return; }
  pState.room = room;
  const s = await fetchFullSession(room.sessionId);
  if(!s){ main.innerHTML = statusBlock('⏳','Carregando...',''); return; }
  applySessionTheme(s.theme);

  if(room.status==='lobby'){ main.innerHTML = statusBlock('🎉','Você entrou na sala de espera!','Aguarde o host iniciar o jogo.'); return; }
  if(room.status==='ended'){ main.innerHTML = statusBlock('🏁','Sessão encerrada','Obrigado por participar!'); return; }

  const board = s.boards[room.activeBoardIndex];
  const boardKey = board.type==='quiz' ? board.id+':'+room.activeQuestionIndex : board.id;
  if(pState.answeredKey !== boardKey){ pState.submitted=false; pState.rankOrder=null; pState.answeredKey=boardKey; }

  if(isBoardExpired(board) && !pState.submitted){
    main.innerHTML = pTitleBlock(board) + statusBlock('⏰','Quadro encerrado','O prazo para responder este quadro já passou.');
    return;
  }

  if(board.type==='multipla_escolha') renderPMultipla(main, board);
  else if(board.type==='nuvem_palavras') renderPNuvem(main, board);
  else if(board.type==='ranking') renderPRanking(main, board);
  else if(board.type==='texto_aberto') renderPTexto(main, board);
  else if(board.type==='quiz') renderPQuiz(main, board, room);
}

async function renderTxFeed(board){
  const feed = document.getElementById('txFeed');
  if(!feed) return;
  const items = await sGetMany(await sList(`tx:${pState.code}:${board.id}:`, true), true);
  const withVotes = await Promise.all(items.map(async it=>{
    const authorId = it.key.split(':').pop();
    const voters = await sList(`uv:${pState.code}:${board.id}:${authorId}:`, true);
    const votedByMe = voters.some(k=>k.endsWith(':'+pState.id));
    return {...it, authorId, votes:voters.length, votedByMe};
  }));
  const approved = withVotes.filter(it=> !board.moderated || it.value.approved===true);
  const myPending = board.moderated ? withVotes.find(it=> it.authorId===pState.id && it.value.approved!==true) : null;
  approved.sort((a,b)=>b.votes-a.votes);
  feed.innerHTML = `<h3 style="font-size:14px;color:var(--muted);margin:0 0 10px;">Mural (${approved.length})</h3>`
    + (myPending ? `<div class="idea-card" style="opacity:0.6;"><p>${escapeHtml(myPending.value.text)}</p><span style="font-size:11px;color:var(--muted);flex:none;">⏳ Aguardando aprovação</span></div>` : '')
    + approved.map(it=>`
    <div class="idea-card"><p>${escapeHtml(it.value.text)}</p>
      <button class="upvote-btn ${it.votedByMe?'voted':''}" onclick="toggleUpvote('${board.id}','${it.authorId}',${it.votedByMe},${!!board.moderated})">👍 ${it.votes}</button>
    </div>`).join('');
}
async function toggleUpvote(boardId, authorId, currentlyVoted, moderated){
  const key = `uv:${pState.code}:${boardId}:${authorId}:${pState.id}`;
  if(currentlyVoted){ await sDelete(key, true); }
  else{ await sSet(key, {ts:Date.now()}, true); }
  await renderTxFeed({id:boardId, moderated});
}
async function renderPQuiz(main, board, room){
  if(room.activeQuestionIndex >= board.questions.length){
    main.innerHTML = pTitleBlock(board) + statusBlock('🏆','Quiz finalizado!','Confira o pódio no telão.');
    return;
  }
  const q = board.questions[room.activeQuestionIndex];
  if(pState.submitted){
    if(room.revealed){
      main.innerHTML = pTitleBlock(board) + `
        <div class="p-status" style="padding-top:14px;padding-bottom:10px;">
          <div class="big-ico">${pState.lastCorrect ? '🎉' : '🤔'}</div>
          <h2>${pState.lastCorrect ? 'Boa! Resposta certa' : 'Não foi dessa vez'}</h2>
        </div>
        ${q.options.map((o,i)=>{
          const isCorrect = i===q.correctIndex;
          const isMine = i===pState.lastChosenIndex;
          const cls = isCorrect ? 'correct' : (isMine ? 'wrong' : '');
          return `<button class="opt-btn ${cls}" disabled><span class="letter">${String.fromCharCode(65+i)}</span>${escapeHtml(o)}</button>`;
        }).join('')}
      `;
      return;
    }
    main.innerHTML = pTitleBlock(board) + statusBlock('⏳','Resposta enviada','Aguarde o host revelar o resultado.');
    return;
  }
  const elapsed = Date.now() - room.questionStartAt;
  const remaining = Math.max(0, q.timeLimitSec*1000 - elapsed);
  if(remaining<=0){ pState.submitted=true; pState.lastCorrect=false; renderPQuiz(main,board,room); return; }
  const pct = Math.round(remaining / (q.timeLimitSec*1000) * 100);
  main.innerHTML = pTitleBlock(board) + `
    <div class="timer-ring" style="--pct:${pct}"><b>${Math.ceil(remaining/1000)}</b></div>
    <h3 style="text-align:center;margin:0 0 18px;">${escapeHtml(q.text)}</h3>
    ${q.options.map((o,i)=>`<button class="opt-btn" onclick="submitQuizAns('${board.id}','${q.id}',${i},${q.correctIndex})"><span class="letter">${String.fromCharCode(65+i)}</span>${escapeHtml(o)}</button>`).join('')}
  `;
}
async function submitQuizAns(boardId, qId, idx, correctIndex){
  const timeMs = Date.now() - pState.room.questionStartAt;
  const correct = idx===correctIndex;
  await sSet(`qa:${pState.code}:${boardId}:${qId}:${pState.id}`, {optionIndex:idx, timeMs, correct, name:pState.name}, true);
  pState.submitted = true; pState.lastCorrect = correct; pState.lastChosenIndex = idx;
  renderParticipantLoop();
}

/* ============================= TELÃO ============================= */
let tState = { code:null, room:null, celebratedKey:null };
function renderTelao(){
  const params = new URLSearchParams(location.hash.split('=')[1] ? '' : (location.hash.split('?')[1]||''));
  const hashParts = location.hash.split('=');
  const prefillCode = hashParts.length>1 ? hashParts[1] : '';
  if(!tState.code && prefillCode){ tState.code = prefillCode.toUpperCase(); }
  if(!tState.code){
    app.innerHTML = `<div class="telao"><div class="telao-body">
      <div class="join-hero">
        <div class="brandmark" style="height:72px;padding:14px 18px;"><img src="${SEBRAE_MARK}" alt="Sebrae"></div>
        <h1 class="display" style="font-size:30px;margin:0;">Digite o código da sala</h1>
        <input type="text" id="telaoCode" maxlength="15" style="text-transform:uppercase;font-family:'JetBrains Mono',monospace;font-size:28px;text-align:center;letter-spacing:0.12em;padding:14px 20px;border-radius:14px;border:none;width:min(90vw,340px);">
        <button class="btn btn-primary" onclick="loadTelao()">Abrir telão</button>
      </div>
    </div></div>`;
    return;
  }
  app.innerHTML = `<div class="telao" id="telaoRoot"></div>`;
  renderTelaoLoop();
  POLL = setInterval(renderTelaoLoop, 3500);
}
function loadTelao(){
  const v = document.getElementById('telaoCode').value.trim().toUpperCase();
  if(v.length<3){ toast('Digite o código da sala'); return; }
  tState.code = v; renderTelao();
}
function toggleTelaoFullscreen(){
  const el = document.documentElement;
  const isFullscreen = document.fullscreenElement || document.webkitFullscreenElement;
  if(isFullscreen){
    (document.exitFullscreen || document.webkitExitFullscreen)?.call(document);
    return;
  }
  const request = el.requestFullscreen || el.webkitRequestFullscreen;
  if(!request){ toast('Tela cheia não é permitida neste ambiente de pré-visualização.'); return; }
  request.call(el).catch(()=>{ toast('Este ambiente bloqueou a tela cheia — funciona normalmente no link publicado.'); });
}
async function renderTelaoLoop(){
  const root = document.getElementById('telaoRoot');
  if(!root) return;
  const room = await sGet('room:'+tState.code, true);
  if(!room){ root.innerHTML = telaoShell(`<h2 class="qtitle">Sala não encontrada</h2>`); return; }
  const partKeys = await sList('p:'+tState.code+':', true);
  const s = await fetchFullSession(room.sessionId);
  applySessionTheme(s?.theme);

  const topbar = `<div class="telao-top"><div class="brand"><div class="brandmark"><img src="${s?.theme?.logo || SEBRAE_MARK}" alt="Logo" style="${s?.theme?.logo?'':'padding:6px;'}"></div>${escapeHtml(s?.name || 'Interage')}</div>
    <div class="telao-meta"><span class="chip">Sala ${tState.code}</span><span class="chip">👥 ${partKeys.length}</span><button onclick="toggleTelaoFullscreen()" title="Tela cheia" style="background:rgba(255,255,255,0.08);border-radius:10px;padding:8px 12px;color:white;font-size:15px;">⛶</button></div></div>`;

  if(!s || room.status==='lobby'){
    const joinBase = safeBaseUrl();
    const joinLink = bestAvailableBase() ? bestAvailableBase() + '#participar?sala=' + tState.code : tState.code;
    const showQR = !s?.hideQR;
    const joinQrHtml = showQR ? qrSvgMarkup(joinLink, 220) : '';
    document.getElementById('telaoRoot').innerHTML = topbar + `<div class="telao-body">
      <div class="join-hero" style="flex-direction:row;gap:40px;align-items:center;flex-wrap:wrap;justify-content:center;">
        ${showQR ? `<div class="qr-box">${joinQrHtml}</div>` : ''}
        <div style="display:flex;flex-direction:column;align-items:center;gap:18px;">
          <div class="eyebrow" style="color:var(--coral);"><span class="pulse-dot"></span> Entre pelo celular</div>
          <div class="code-huge" style="font-size:clamp(28px,6vw,70px);">${tState.code}</div>
          <p style="color:#C3CDF0;font-size:15px;max-width:320px;text-align:center;">${showQR ? (joinBase ? 'Escaneie o QR code ou acesse pelo navegador e digite o código. Sem app, sem login.' : 'Escaneie ou acesse o app e digite o código. Sem app, sem login.') : 'Acesse o app e digite o código acima. Sem app, sem login.'}</p>
        </div>
      </div>
    </div>`;
    return;
  }
  if(room.status==='ended'){
    const completeBadge = room.completed===false
      ? `<span style="display:inline-flex;align-items:center;gap:6px;background:rgba(232,84,107,0.18);color:#FF9FB0;padding:6px 14px;border-radius:999px;font-size:13px;font-weight:600;margin-bottom:18px;">⚠️ Sessão incompleta</span>`
      : `<span style="display:inline-flex;align-items:center;gap:6px;background:rgba(46,158,91,0.18);color:#7CE0A0;padding:6px 14px;border-radius:999px;font-size:13px;font-weight:600;margin-bottom:18px;">✅ Sessão completa</span>`;
    document.getElementById('telaoRoot').innerHTML = topbar + telaoBody(`
      <div>${completeBadge}</div>
      <h2 class="qtitle">🏁 Obrigado por participar!</h2>
      <p style="color:#C3CDF0;font-size:15px;margin-top:-10px;">👥 ${partKeys.length} participante${partKeys.length===1?'':'s'} nesta sessão</p>
    `);
    return;
  }

  const board = s.boards[room.activeBoardIndex];
  let inner = '';
  let isPodium = false;
  if(board.type==='quiz'){
    inner = await telaoQuiz(board, room, s);
    isPodium = room.activeQuestionIndex >= board.questions.length;
  }
  else if(board.type==='multipla_escolha') inner = await telaoMultipla(board);
  else if(board.type==='nuvem_palavras') inner = await telaoNuvem(board);
  else if(board.type==='ranking') inner = await telaoRanking(board);
  else if(board.type==='texto_aberto') inner = await telaoTexto(board);

  const dots = s.boards.map((b,i)=>`<div class="d ${i===room.activeBoardIndex?'active':''}"></div>`).join('');
  document.getElementById('telaoRoot').innerHTML = topbar + telaoBody(inner) + `<div class="progress-dots">${dots}</div>`;

  if(isPodium){
    const celebrateKey = tState.code+':'+board.id+':podium';
    if(tState.celebratedKey !== celebrateKey){
      tState.celebratedKey = celebrateKey;
      launchConfetti();
      playFanfare();
    }
  }
}
function telaoShell(inner){ return `<div class="telao-top"><div class="brand">Interage</div></div>` + telaoBody(inner); }
function telaoBody(inner){ return `<div class="telao-body">${inner}</div>`; }

async function telaoMultipla(board){
  const answers = await sGetMany(await sList(`mc:${tState.code}:${board.id}:`, true), true);
  const counts = board.options.map(()=>0);
  answers.forEach(a=>{ if(typeof a.value.optionIndex==='number') counts[a.value.optionIndex]++; });
  const total = answers.length || 1;
  const maxC = Math.max(...counts,1);
  return `<h2 class="qtitle">${escapeHtml(board.title)}</h2><div class="telao-bars">${board.options.map((o,i)=>`
    <div class="telao-bar-row"><div class="lab"><span>${String.fromCharCode(65+i)}. ${escapeHtml(o)}</span><span>${counts[i]}</span></div>
    <div class="telao-bar-track"><div class="telao-bar-fill" style="width:${Math.max(counts[i]/maxC*100,3)}%">${counts[i]?Math.round(counts[i]/total*100)+'%':''}</div></div></div>`).join('')}</div>`;
}
async function telaoNuvem(board){
  const answers = await sGetMany(await sList(`wc:${tState.code}:${board.id}:`, true), true);
  const freq = {};
  answers.forEach(a=>{ const w=(a.value.word||'').trim().toLowerCase(); if(w) freq[w]=(freq[w]||0)+1; });
  const entries = Object.entries(freq).sort((a,b)=>b[1]-a[1]).slice(0,60);
  const palette = ['var(--coral)','#7C97F2','var(--gold)','#6BE0A0','var(--violet)'];
  return `<h2 class="qtitle">${escapeHtml(board.title)}</h2><div class="telao-cloud" style="display:flex;flex-wrap:wrap;gap:14px 22px;justify-content:center;max-width:1000px;">
    ${entries.map(([w,c],i)=>`<span style="font-size:${Math.min(18+c*8,80)}px;color:${palette[i%palette.length]};">${escapeHtml(w)}</span>`).join('') || '<span style="font-size:20px;color:#8FA0DE;">Aguardando respostas...</span>'}</div>`;
}
async function telaoRanking(board){
  const answers = await sGetMany(await sList(`rk:${tState.code}:${board.id}:`, true), true);
  const scores = board.options.map(()=>0);
  answers.forEach(a=>{ (a.value.order||[]).forEach((optIdx,pos)=>{ scores[optIdx]+= (board.options.length-pos); }); });
  const maxScore = Math.max(...scores,1);
  const order = board.options.map((o,i)=>({o,score:scores[i]})).sort((a,b)=>b.score-a.score);
  return `<h2 class="qtitle">${escapeHtml(board.title)}</h2><div class="telao-bars">${order.map(({o,score})=>`
    <div class="telao-bar-row"><div class="lab"><span>${escapeHtml(o)}</span><span>${score} pts</span></div>
    <div class="telao-bar-track"><div class="telao-bar-fill" style="width:${Math.max(score/maxScore*100,3)}%;background:linear-gradient(90deg,#FF9F45,#c9791f);"></div></div></div>`).join('')}</div>`;
}
async function telaoTexto(board){
  const items = await sGetMany(await sList(`tx:${tState.code}:${board.id}:`, true), true);
  const withVotes = await Promise.all(items.map(async it=>{
    const authorId = it.key.split(':').pop();
    const voters = await sList(`uv:${tState.code}:${board.id}:${authorId}:`, true);
    return {...it, votes:voters.length};
  }));
  const visible = board.moderated ? withVotes.filter(it=>it.value.approved===true) : withVotes;
  visible.sort((a,b)=>b.votes-a.votes);
  return `<h2 class="qtitle">${escapeHtml(board.title)}</h2><div style="width:100%;max-width:900px;max-height:60vh;overflow-y:auto;">${
    visible.slice(0,20).map(it=>`<div class="telao-idea"><span>${escapeHtml(it.value.text)}</span><span class="v">👍 ${it.votes}</span></div>`).join('') || '<p style="color:#8FA0DE;">Aguardando envios...</p>'
  }</div>`;
}
async function telaoQuiz(board, room, s){
  if(room.activeQuestionIndex >= board.questions.length){
    const podiumSize = board.podiumSize || 3;
    const rank = (await computeQuizScores(tState.code, board)).slice(0, podiumSize);
    const top3 = rank.slice(0,3);
    const rest = rank.slice(3);
    const podiumHtml = `<div class="podium">
      ${top3[1]?`<div class="p-col p2"><div class="medal">🥈</div><div class="name">${escapeHtml(dispName(top3[1].name, s?.anonymous))}</div><div class="pts">${top3[1].score} pts</div><div class="bar"></div></div>`:''}
      ${top3[0]?`<div class="p-col p1"><div class="medal">🥇</div><div class="name">${escapeHtml(dispName(top3[0].name, s?.anonymous))}</div><div class="pts">${top3[0].score} pts</div><div class="bar"></div></div>`:''}
      ${top3[2]?`<div class="p-col p3"><div class="medal">🥉</div><div class="name">${escapeHtml(dispName(top3[2].name, s?.anonymous))}</div><div class="pts">${top3[2].score} pts</div><div class="bar"></div></div>`:''}
    </div>`;
    const restHtml = rest.length ? `<div class="podium-rest">${rest.map((p,i)=>`
      <div class="podium-rest-row"><span class="pos">${i+4}º</span><span class="name">${escapeHtml(dispName(p.name, s?.anonymous))}</span><span class="pts">${p.score} pts</span></div>`).join('')}</div>` : '';
    return `<h2 class="qtitle">🏆 Pódio</h2>${podiumHtml}${restHtml}`;
  }
  const q = board.questions[room.activeQuestionIndex];
  const elapsed = Date.now()-room.questionStartAt;
  const remaining = Math.max(0,q.timeLimitSec*1000-elapsed);
  const answers = await sGetMany(await sList(`qa:${tState.code}:${board.id}:${q.id}:`, true), true);
  const counts = q.options.map(()=>0);
  answers.forEach(a=>{ if(typeof a.value.optionIndex==='number') counts[a.value.optionIndex]++; });
  const total = answers.length||1;
  const maxC = Math.max(...counts,1);
  return `<div style="margin-bottom:6px;color:var(--gold);font-family:'JetBrains Mono',monospace;font-size:15px;">Pergunta ${room.activeQuestionIndex+1}/${board.questions.length} · ⏱ ${Math.ceil(remaining/1000)}s · ${total} respostas</div>
    <h2 class="qtitle">${escapeHtml(q.text)}</h2><div class="telao-bars">${q.options.map((o,i)=>`
    <div class="telao-bar-row"><div class="lab"><span>${String.fromCharCode(65+i)}. ${escapeHtml(o)}</span><span>${counts[i]}</span></div>
    <div class="telao-bar-track"><div class="telao-bar-fill ${room.revealed && i===q.correctIndex?'correct':''}" style="width:${Math.max(counts[i]/maxC*100,3)}%">${counts[i]?Math.round(counts[i]/total*100)+'%':''}</div></div></div>`).join('')}</div>`;
}

/* ============================= UTIL ============================= */
function escapeHtml(str){ return String(str??'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function escapeAttr(str){ return escapeHtml(str); }
function dispName(name, anon){ return anon ? 'Anônimo' : (name || 'Anônimo'); }

loadCurrentUser().then(route);
</script>
